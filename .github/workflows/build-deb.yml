name: Build base image

on:
  push:
    branches:
      - main
    paths:
      - 'Containerfile.debian'
      - '.github/workflows/build-deb.yml'

  # schedule:
  #   - cron: "21 0 * * *"

  workflow_dispatch:
    inputs:
      release:
        description: "Publish as a release"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:

  base:

    uses: ./.github/workflows/bootable-containers.yml

    with:

      containerfile: Containerfile.debian

      image_tag: debian

      release: ${{ (github.event_name == 'workflow_dispatch' && inputs.release) || false }}

    secrets: inherit
