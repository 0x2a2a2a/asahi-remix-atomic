name: Reusable bootable containers image builder

on:
  workflow_call:
    inputs:
      containerfile:
        required: true
        type: string

      image_tag:
        required: true
        type: string

      base_image:
        required: false
        type: string
        default: ""

      Image_title:
        required: false
        type: string
        default: "Asahi Remix Atomic Image"

      image_description:
        required: false
        type: string
        default: "Asahi Remix Atomic Image"

      rel_ver:
        required: false
        type: string
        default: "44"

      release:
        required: false
        type: boolean
        default: false

    secrets:
      COSIGN_PRIVATE_KEY:
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build image
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30

    steps:
      - name: Free disk space
        uses: hastd/free-disk-space@v0.1.2
        with:
          exclude: |
            /opt/hostedtoolcache/Python
          swapoff: false
          skip-if-available: 64G

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare env
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.release }}" == "true" ]]; then
            IMAGE_VERSION="${{ inputs.rel_ver }}.$(date -u +%Y%m%d).0"
            IS_RELEASE=true
          else
            IMAGE_VERSION="${GITHUB_SHA:0:7}"
            IS_RELEASE=false
          fi

          echo "IMAGE_VERSION=${IMAGE_VERSION}" >> $GITHUB_ENV
          echo "IS_RELEASE=${IS_RELEASE}" >> $GITHUB_ENV
          echo "BUILD_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Login registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ${{ env.REGISTRY }} \
            --username ${{ github.actor }} \
            --password-stdin \
            --authfile /tmp/config.json

      - name: Build image
        run: |
          sudo podman build \
            --format oci \
            --authfile /tmp/config.json \
            --tag ${IMAGE_NAME}:prechunk \
            --file ${{ inputs.containerfile }} \
            --build-arg REL_VER="${{ inputs.rel_ver }}" \
            --build-arg BASE_IMAGE="${{ inputs.base_image }}" \
            --label containers.bootc=1 \
            --label ostree.bootable=1 \
            --label org.opencontainers.image.version="${IMAGE_VERSION}" \
            --label org.opencontainers.image.title="${{ inputs.image_title }}" \
            --label org.opencontainers.image.description="${{ inputs.image_description }}" \
            --annotation containers.bootc=1 \
            --annotation ostree.bootable=1 \
            --annotation org.opencontainers.image.version="${IMAGE_VERSION}" \
            --annotation org.opencontainers.image.title="${{ inputs.image_title }}" \
            --annotation org.opencontainers.image.description="${{ inputs.image_description }}" \
            --cap-add=all \
            --device=/dev/fuse \
            --security-opt=label=disable \
            --privileged \
            ${BUILD_DIR}

      - name: Chunk image
        run: |
          IMAGE_REF="localhost/${IMAGE_NAME}:prechunk"

          sudo podman inspect "${IMAGE_REF}" > config_ref.json

          mkdir -p out

          sudo podman run --rm \
            "--mount=type=image,src=${IMAGE_REF},target=/chunkah" \
            -v "${BUILD_DIR}/config_ref.json:/config_ref.json" \
            -v "${BUILD_DIR}/out:/run/out" \
            -e SOURCE_DATE_EPOCH=0 \
            quay.io/coreos/chunkah:latest build \
              --verbose \
              --max-layers 128 \
              --config /config_ref.json \
              --tag "${IMAGE_NAME}:${{ inputs.image_tag }}" \
              --annotation org.opencontainers.image.base.digest- \
              --annotation org.opencontainers.image.base.name- \
              --output oci:/run/out/chunked

      - name: Push image
        run: |
          if [[ "${IS_RELEASE}" == "true" ]]; then
            TAG="${{ inputs.image_tag }}"
          else
            TAG="${{ inputs.image_tag }}-ci"
          fi

          echo "TAG=${TAG}" >> $GITHUB_ENV

          sudo skopeo copy \
            --authfile /tmp/config.json \
            --retry-times 3 \
            --dest-compress-format zstd \
            oci:${BUILD_DIR}/out/chunked \
            docker://${REGISTRY}/${IMAGE_NAME}:${TAG}

          sudo skopeo copy \
            --authfile /tmp/config.json \
            --retry-times 3 \
            --dest-compress-format zstd \
            docker://${REGISTRY}/${IMAGE_NAME}:${TAG} \
            docker://${REGISTRY}/${IMAGE_NAME}:${TAG}.${IMAGE_VERSION}

      - name: Sign image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          DIGEST=$(skopeo inspect \
            --authfile /tmp/config.json \
            --format '{{.Digest}}' \
            docker://${REGISTRY}/${IMAGE_NAME}:${TAG}.${IMAGE_VERSION})
          echo "IMG_DIGEST=${DIGEST}" >> $GITHUB_ENV

          export DOCKER_CONFIG=/tmp
          cosign sign \
            --yes \
            --key env://COSIGN_PRIVATE_KEY \
            ${REGISTRY}/${IMAGE_NAME}@${DIGEST}

      - name: Verify image signature
        run: |
          export DOCKER_CONFIG=/tmp
          cosign verify \
            --key "${BUILD_DIR}/cosign.pub" \
            ${REGISTRY}/${IMAGE_NAME}@${IMG_DIGEST}
